[package]
name = "consortium-crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library — Rust implementation of ClusterShell"

# CON-97: `lib.name` was under `[package]`, where cargo ignores it (it warns
# `unused manifest key: package.lib`), so the lib target was really named
# `consortium_crate` and every `use consortium::…` in tests/docker_integration.rs
# and tests/tool_integration.rs failed with `unresolved module or unlinked crate
# `consortium``. Those two test targets could not compile, so the docker- and
# tool-integration gates could only ever report a compile error. Declared where
# cargo reads it, which is what the original comment above it always intended.
[lib]
name = "consortium"

[dependencies]
thiserror.workspace = true
slotmap = "1.1"
configparser = "3"
dirs-next = "2"
hostname = "0.4"
libc = "0.2"

[features]
docker-tests = []

[dev-dependencies]
tempfile = "3"
consortium-test-harness = { path = "../consortium-test-harness" }
consortium-nix = { path = "../consortium-nix" }
consortium-fanout-sim = { path = "../consortium-fanout-sim" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
