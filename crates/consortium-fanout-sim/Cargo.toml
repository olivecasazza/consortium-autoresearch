[package]
name = "consortium-fanout-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic simulator for the consortium cascade primitive"
# Never published: this crate imports `consortium_nix::cascade`, a module that
# exists only in this workspace's `consortium-nix` and in no released version of
# it. `cargo publish` resolves the dependency from the registry during
# verification, so the tarball cannot compile. See CON-204.
publish = false

[dependencies]
consortium-nix = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
consortium-cli = { path = "../consortium-cli" }
serde_json = "1"

[[bench]]
name = "cascade_strategies"
harness = false

[package.metadata.docs.rs]
all-features = true
