[package]
name = "consortium-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Docker-based mini-HPC test harness for consortium"
# Never published: a test-only harness, already excluded in spirit by the
# "(exclude test harness and py bindings)" note in release-plz.toml. Stated in
# Cargo.toml so cargo, not just release-plz, is the authority. See CON-204.
publish = false

[dependencies]
consortium.workspace = true
consortium-nix.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
