name: CON454 diag4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: CON454 nix-daemon enablement
    runs-on: nix-builder
    timeout-minutes: 10
    steps:
      - name: Enumeration
        run: |
          set +e
          echo "### machine: $(hostname)"
          echo "### full multi-user.target.wants listing"
          ls -la /etc/systemd/system/multi-user.target.wants/ 2>&1
          echo "### does ANY nix unit appear in any .wants dir?"
          find /etc/systemd/system -name '*nix*' 2>&1
          echo "### dbus.service in wants?"
          ls -la /etc/systemd/system/*.wants/ 2>&1 | head -40
          echo "### nix settings: daemon vs local"
          grep -E "build-users-group|sandbox|max-jobs|store" /etc/nix/nix.conf 2>&1
          echo "### /etc/static/nix/nix.conf build-users-group"
          grep -n "build-users-group" /etc/static/nix/nix.conf 2>&1
          echo "(empty above means single-user mode is impossible / default nixbld)"
          echo "### any nixbld users?"
          ls -la /etc/passwd 2>&1 | grep -c nixbld
          ls -la /etc/passwd 2>&1 | grep nixbld | head -3
          echo "### /nix/var/nix/daemon-socket dir listing (again)"
          ls -la /nix/var/nix/daemon-socket/ 2>&1