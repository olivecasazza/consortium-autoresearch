name: CON454 probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: CON454 nix store forensics
    runs-on: nix-builder
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Forensics
        run: |
          set +e
          export PATH=/run/current-system/sw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH

          say() { printf '\n=== %s ===\n' "$1"; }

          say "identity"
          hostname
          printf 'PATH=%s\n' "$PATH"
          for t in systemctl python3 getent sudo stat grep find findmnt mount df; do
            printf 'have %-9s : %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

          say "container/sandbox detection"
          printf 'pid1=%s\n' "$(cat /proc/1/comm 2>&1)"
          printf 'dockerenv=%s\n' "$(test -f /.dockerenv && echo yes || echo no)"
          grep -qa 'docker\|kubepods\|containerd' /proc/1/cgroup 2>/dev/null && echo 'cgroup: container' || echo 'cgroup: host'

          say "DISK (tests the 'disk full' hypothesis)"
          df -h / /nix /nix/store 2>&1
          printf 'free bytes on /: '; df --output=avail -B1 / 2>/dev/null | tail -1
          printf 'free bytes on /nix/store: '; df --output=avail -B1 /nix/store 2>/dev/null | tail -1
          printf 'inodes free on /: '; df --output=iavail -i / 2>/dev/null | tail -1

          say "MOUNT FACTS"
          grep -E ' / | /nix' /proc/mounts 2>&1
          printf 'mountpoint test /nix/store: '; mountpoint -q /nix/store 2>/dev/null && echo "IS a mountpoint" || echo "not a separate mountpoint"
          printf 'write probe /nix/store/.probe: '
          ( touch /nix/store/.con454probe 2>&1 && echo WRITABLE && rm -f /nix/store/.con454probe ) || echo NOT-WRITABLE
          printf 'write probe /nix/var/nix/db/.probe: '
          ( touch /nix/var/nix/db/.con454probe 2>&1 && echo WRITABLE && rm -f /nix/var/nix/db/.con454probe ) || echo NOT-WRITABLE

          say "NIX-DAEMON UNIT"
          ls -la /etc/systemd/system/nix-daemon.service 2>&1
          ls -la /etc/systemd/system/multi-user.target.wants/ 2>&1 | grep -i nix || echo 'no nix unit in multi-user.target.wants'
          printf 'systemctl is-enabled: '; systemctl is-enabled nix-daemon 2>&1
          printf 'systemctl is-active:  '; systemctl is-active  nix-daemon 2>&1
          printf 'systemctl functional:  '; systemctl is-system-running 2>&1

          say "EFFECTIVE NIX CONFIG"
          nix config show build-users-group 2>&1
          printf 'store = '; nix config show store 2>&1
          printf 'sandbox = '; nix config show sandbox 2>&1
          printf 'NIX_REMOTE=[%s]\n' "${NIX_REMOTE}"
          printf 'NIX_CONFIG=[%s]\n' "${NIX_CONFIG}"
          printf 'whoami: '; id

          say "WHAT ACTUALLY WORKS"
          printf 'default store      : '; nix store info --json 2>&1 | head -c 200; echo
          printf 'store=local        : '; NIX_REMOTE=local nix store info --json 2>&1 | head -c 200; echo
          printf 'single-user (bug grp) : '; nix store info --option build-users-group "" --json 2>&1 | head -c 200; echo