name: Migration Scorecard

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - 'doc/**'
      - 'README.md'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - 'doc/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ClusterShell ref to test against (default: pinned in UPSTREAM_REF)"
        required: false
        default: ""

# `checks: write` is required by mikepenz/action-junit-report so the JUnit gate
# can create its check run. Without it the report was printed and discarded.
permissions:
  contents: read
  checks: write

jobs:
  # ── Layer 1: Unit Tests (fast, no external deps) ──────────────────
  scorecard:
    name: Unit Tests & Migration Scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Toolchains ─────────────────────────────────────────────
      # CON-97: the pin is read from rust-toolchain.toml, never duplicated in
      # the workflow, so bumping it is a one-line commit with no workflow edit.
      - name: Read toolchain pin
        id: pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          echo "channel=$PIN" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt, rust-src

      - name: Verify toolchain pin
        run: |
          PIN="${{ steps.pin.outputs.channel }}"
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::CI toolchain (${ACTUAL}) does not match rust-toolchain.toml pin (${PIN})"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install virtualenv
          python -m virtualenv .venv
          source .venv/bin/activate
          pip install pytest pytest-timeout pytest-xdist maturin pyyaml

      # ── Upstream sync ──────────────────────────────────────────
      - name: Sync upstream tests
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"
          if [ -z "$REF" ]; then
            bash harness/sync_upstream_tests.sh
          else
            bash harness/sync_upstream_tests.sh "$REF"
          fi

      # ── Build ──────────────────────────────────────────────────
      - name: Build PyO3 bindings
        run: |
          cd crates/consortium-py
          source ../../.venv/bin/activate
          maturin develop --release

      # ── Rust unit tests ────────────────────────────────────────
      # `continue-on-error` and the `| tee` exit-code mask are both gone.
      # `-p consortium` never matched a package — the crate at crates/consortium
      # is `consortium-crate` (its *lib* is named `consortium`) — so this step
      # was dying on `package ID specification 'consortium' did not match any
      # packages` and the guard hid it. `results/rust-unit.xml` was an empty
      # tests="0" failures="0" suite that the scorecard rendered as green.
      # `set -o pipefail` keeps nextest's exit code through the tee.
      - name: Run Rust unit tests
        id: rust_unit
        run: |
          set -o pipefail
          mkdir -p results
          source .venv/bin/activate
          cargo nextest run \
            -p consortium-crate \
            --profile ci \
            --no-fail-fast 2>&1 | tee results/rust-raw.txt

      - name: Collect Rust JUnit report
        if: always()
        run: |
          mkdir -p results
          if [ ! -f target/nextest/ci/junit.xml ]; then
            echo "::error::nextest wrote no JUnit report (target/nextest/ci/junit.xml missing)"
            exit 1
          fi
          cp -f target/nextest/ci/junit.xml results/rust-unit.xml

      - name: Publish Rust test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: results/rust-unit.xml
          check_name: Rust Unit Test Results
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      # ── Python tests: original backend ─────────────────────────
      # `continue-on-error` and the trailing `|| true` are both removed: this is
      # the step that decides whether a red Python test is red CI.
      # `if: ${{ !cancelled() }}` added: GitHub's default step condition is
      # `success()`, so a red Rust unit suite used to leave this step *skipped*.
      # A skipped test step is the same defect as a swallowed one — the Python
      # signal never reaches the job conclusion at all. `!cancelled()` keeps the
      # step reachable after the Rust step fails without masking its own result.
      - name: Run Python tests (original backend)
        id: py_original
        if: ${{ !cancelled() }}
        env:
          CONSORTIUM_BACKEND: python
          PYTHONPATH: ${{ github.workspace }}/lib
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v \
            --timeout=30 \
            --tb=short \
            --junit-xml=results/python-original.xml

      - name: Publish Python results (original backend)
        if: always() && steps.py_original.outcome != 'skipped'
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: results/python-original.xml
          check_name: Python Results (original backend)
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      # ── Python tests: Rust backend ─────────────────────────────
      # CON-97: `if: ${{ !cancelled() }}` added. GitHub's default step condition is
      # `success()`, so while the original-backend step above was red this step was
      # *skipped* — a red test in the Rust backend could not be observed at all, and
      # `results/python-rust.xml` was never written. A skipped test step is the same
      # defect as a swallowed one: the signal never reaches the job conclusion.
      # `!cancelled()` keeps the step reachable after a sibling failure; it does not
      # mask anything, because its own exit code still decides the step conclusion.
      #
      # CON-116. This step used to die during *collection* on all 29 test modules
      # with `ModuleNotFoundError: No module named 'ClusterShell.CLI'`, which
      # CON-97's un-swallowing made visible for the first time.
      #
      # Cause, recorded because the obvious fix is the wrong one: the bindings
      # package is *hybrid*, not a wholesale replacement for ClusterShell. Only
      # RangeSet and NodeSet have a Rust implementation; every other module
      # resolves to the upstream pure-Python source at lib/. __init__.py only did
      # that path surgery for CONSORTIUM_BACKEND=python, so under `rust` the
      # unported modules were not importable at all.
      #
      # Do NOT "fix" this with PYTHONPATH: ${{ github.workspace }}/lib the way
      # the original-backend step above does. That puts lib/ at the *front* of
      # sys.path, so lib/ClusterShell shadows the installed bindings package
      # wholesale: ClusterShell._consortium becomes unimportable and the step
      # labelled "Rust backend" silently runs the pure-Python backend. A step
      # reporting on the wrong thing is worse than a red step. The bindings
      # package extends its own __path__ instead, so a binding always wins and
      # upstream only fills the gaps. LIB_CLUSTERSHELL just pins where "upstream"
      # is, so the result does not depend on maturin having installed editable.
      #
      # Port status, measured against upstream v1.9.3 (761 tests collected, 8
      # modules still failing to import): only RangeSet and NodeSet are ported,
      # and both are partial. The 8 unimportable modules are all blocked on the
      # same two gaps — the group-resolver API (std_group_resolver,
      # set_std_group_resolver, set_std_group_resolver_config, expand, fold,
      # grouplist, NodeSetBase) and RangeSetND:
      #   CLI{Clubak,Lush,Config,Display,Nodeset}Test, NodeSetTest,
      #   RangeSetNDTest, TreeTopologyTest
      # They are left erroring rather than deselected — a collection error is a
      # legitimate red, and hiding it is the defect CON-97 exists to stop. See
      # CON-34 / CON-206 for the two unported features behind all 8.
      #
      # `--continue-on-collection-errors` is NOT a swallow, and is the opposite of
      # one. pytest's default is to run *zero* tests when anything fails to
      # collect, so those 8 modules were discarding the other 728 and the junit
      # report said "8 tests run, 0 passed" — one un-importable module blinding
      # the entire backend. With the flag, the 8 still fail the step (they are
      # reported as errors and `fail_on_failure` still goes red) and the other
      # 728 finally produce signal. The original-backend step collects 100% and
      # does not need it.
      - name: Run Python tests (Rust backend)
        id: py_rust
        if: ${{ !cancelled() }}
        env:
          CONSORTIUM_BACKEND: rust
          LIB_CLUSTERSHELL: ${{ github.workspace }}/lib
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v \
            --timeout=30 \
            --tb=short \
            --continue-on-collection-errors \
            --junit-xml=results/python-rust.xml

      - name: Publish Python results (Rust backend)
        if: always() && steps.py_rust.outcome != 'skipped'
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: results/python-rust.xml
          check_name: Python Results (Rust backend)
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      # ── Generate scorecard ─────────────────────────────────────
      # These stay unconditional so the scorecard artifact and the uploaded
      # reports are still produced when a test step goes red. They do not mask
      # anything: the job is already red by then, and a non-zero exit from
      # either script is still a failure.
      - name: Generate test mapping
        if: always()
        run: python harness/generate_test_mapping.py --update

      - name: Render scorecard
        if: always()
        run: python harness/render_summary.py --results-dir=results >> $GITHUB_STEP_SUMMARY

      # ── Upload artifacts ───────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-results
          path: |
            results/
            target/nextest/ci/junit.xml
            TEST_MAPPING.toml
          if-no-files-found: error
          retention-days: 30

  # ── Layer 2: Integration Tests (Docker, runs after unit tests) ────
  integration:
    name: Docker Integration Tests
    needs: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pin
        id: pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          echo "channel=$PIN" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt, rust-src

      - name: Verify toolchain pin
        run: |
          PIN="${{ steps.pin.outputs.channel }}"
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::CI toolchain (${ACTUAL}) does not match rust-toolchain.toml pin (${PIN})"
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Docker SSH node image
        run: |
          cd tests/docker
          docker build -t consortium-ssh-node -f Dockerfile.ssh-node .

      # `continue-on-error` was never set on these two, but both ended in
      # `|| true`, and both named a package that does not exist (`consortium`
      # vs `consortium-crate`), so neither had ever run a test.
      - name: Run integration tests (small cluster — 6 nodes)
        run: |
          set -o pipefail
          cargo test -p consortium-crate \
            --features docker-tests \
            --test docker_integration \
            --no-fail-fast \
            -- --test-threads=1 \
            -Z unstable-options --format json 2>&1 | tee results-integration.json

      # CON-97: `if: ${{ !cancelled() }}` added for the same reason as the Python
      # steps above. With the default `success()` condition a red 6-node suite left
      # the 33-node suite `skipped`, so the scale test could never report red.
      - name: Run integration tests (large cluster — 33 nodes)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p consortium-crate \
            --features docker-tests \
            --test docker_integration \
            --no-fail-fast \
            test_scale -- --test-threads=1

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker ps -a --filter "name=consortium-test" -q | xargs -r docker rm -f
          docker network ls --filter "name=consortium-test" -q | xargs -r docker network rm
