name: CON454 diag5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: CON454 local-store probe
    runs-on: nix-builder
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Probe whether a local store works
        run: |
          set +e
          echo "### machine: $(hostname)"
          echo "### default store ping"
          timeout 30 nix store ping 2>&1
          echo "### --store local ping"
          timeout 30 nix store ping --store local 2>&1
          echo "### is /nix/store writable by us?"
          ls -ld /nix/store
          touch /nix/store/.con454-write-probe 2>&1 && echo "WRITABLE" && rm -f /nix/store/.con454-write-probe || echo "NOT WRITABLE"
          echo "### daemon-socket dir writability"
          ls -ld /nix/var/nix/daemon-socket/
          touch /nix/var/nix/daemon-socket/.con454-probe 2>&1 && echo "DIR WRITABLE" && rm -f /nix/var/nix/daemon-socket/.con454-probe || echo "DIR NOT WRITABLE"
          echo "### mounts for those paths"
          grep -E "nix" /proc/mounts 2>&1
          echo "### REAL build via --store local"
          timeout 1200 nix build .#consortium-cli --store local 2>&1 | tail -25
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
          echo "### did the binaries work?"
          ./result/bin/cast --help 2>&1 | head -3
          ./result/bin/claw --help 2>&1 | head -3