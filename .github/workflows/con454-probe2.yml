name: CON454 probe2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: CON454 build-users-group forensics
    runs-on: nix-builder
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Isolate build-users-group
        run: |
          set +e
          export PATH=/run/current-system/sw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
          say() { printf '\n=== %s ===\n' "$1"; }

          say "build-users-group effective value (delimited, so empty is visible)"
          printf '<<%s>>\n' "$(nix config show build-users-group 2>&1)"
          printf 'nixbld group exists: '; getent group nixbld || echo NO
          printf 'nixbld users: '; getent passwd | grep -c nixbld
          printf 'sudo -n true: '; sudo -n true 2>&1 && echo OK || echo DENIED

          say "config files, verbatim"
          printf -- '--- /etc/nix/nix.conf ---\n'; cat /etc/nix/nix.conf 2>&1
          printf -- '--- runner NIX_CONFIG ---\n%s\n' "$NIX_CONFIG"
          printf -- '--- HOME nix.conf ---\n'; cat "$HOME/.config/nix/nix.conf" 2>&1 || echo '(absent)'

          say "does ANY nix command work at all? (no daemon, no local db)"
          printf 'nix --version : '; nix --version 2>&1
          printf 'nix eval 1+1 : '; nix eval --impure --expr '1+1' 2>&1 | head -3

          say "THE DECISIVE TEST: force store=local with build-users-group disabled"
          printf 'local + bug=\"\" : '
          nix --store local --option build-users-group "" eval --impure --expr '1+1' 2>&1 | head -4

          say "THE OTHER DECISIVE TEST: a separate writable store on writable fs"
          printf 'writable dirs: '; for d in /tmp /var/tmp /run/user /run; do test -w "$d" && printf '%s ' "$d"; done; echo
          rm -rf /tmp/con454store 2>/dev/null
          printf 'tmp store eval : '
          nix --store "local?root=/tmp/con454store" --option build-users-group "" eval --impure --expr '1+1' 2>&1 | head -4

          say "can we restart the daemon with the sudo we have?"
          printf 'sudo -n systemctl restart nix-daemon : '
          sudo -n systemctl restart nix-daemon 2>&1 | head -3 || true
          printf 'post-restart ping : '
          timeout 20 nix store info --json 2>&1 | head -c 120; echo