name: CON454 diag3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: CON454 systemd dbus probe
    runs-on: nix-builder
    timeout-minutes: 10
    steps:
      - name: Probe systemd and dbus transport
        run: |
          set +e
          echo "### machine"
          hostname
          echo "### /run/systemd/private exists?"
          ls -la /run/systemd/private 2>&1
          echo "### dbus system socket"
          ls -la /run/dbus/system_bus_socket 2>&1
          ls -la /run/dbus/ 2>&1
          echo "### systemd system.conf / journal"
          ls -la /run/systemd/journal/ 2>&1
          echo "### does systemctl work at all?"
          systemctl is-system-running 2>&1
          echo "### try a harmless unit query"
          systemctl show nix-daemon.service -p ActiveState 2>&1
          echo "### nix-daemon unit file on disk"
          ls -la /etc/systemd/system/nix-daemon.service 2>&1
          cat /etc/systemd/system/nix-daemon.service 2>&1
          echo "### multi-user.target wants"
          ls -la /etc/systemd/system/multi-user.target.wants/ 2>&1 | grep -i nix
          echo "### is dbus systemd-activated? check dbus.service"
          systemctl status dbus.service --no-pager 2>&1 | head -5
          echo "### systemd user manager"
          echo "XDG_RUNTIME_DIR=[$XDG_RUNTIME_DIR]"
          echo "### can we reach the system bus by hand?"
          /run/current-system/sw/bin/busctl --system list 2>&1 | head -5
          echo "### sandbox: are we in a private namespace?"
          ls -la /proc/self/ns/ 2>&1
          echo "### /proc/1 exists?"
          ls -la /proc/1 2>&1 | head -2
          ls /proc/ | head -20
