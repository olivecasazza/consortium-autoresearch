name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'doc/**'
      - 'README.md'
      - '.gitignore'
  # CON-209: the `branches:` filter is gone. It restricted `pull_request` to
  # the default branches, so any PR targeting a feature branch ran NO CI and
  # reported nothing — `gh pr checks` prints "no checks reported on the
  # '<branch>' branch", which reads as "nothing to see" rather than "no signal".
  # This repo stacks PRs, so that left every stacked PR silently unverified
  # against the trunk it is stacked on. Removing the filter makes a PR run CI
  # against whatever same-repo branch it targets. It does not add duplicate
  # runs: `pull_request` fires once per PR, and `push` above stays restricted
  # to the default branches so a `master`-targeting PR is still built once.
  pull_request:
  workflow_dispatch:

# `checks: write` is required by mikepenz/action-junit-report. Without it the
# report step cannot create its check run, so the JUnit gate was inert: the
# report was printed to the log and the failure was dropped on the floor.
permissions:
  contents: read
  checks: write

jobs:
  # ── Layer 1: Unit Tests (fast, GitHub-hosted) ─────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CON-97: CI must run the toolchain `rust-toolchain.toml` pins, and must
      # say so in the log. The pin is read from the file, never duplicated here,
      # so bumping the pin is a one-line commit with no workflow edit.
      - name: Read toolchain pin
        id: pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          echo "channel=$PIN" >> "$GITHUB_OUTPUT"

      # The `@stable` ref is the action's own code selector and is unused when
      # the `toolchain` input is supplied; the input wins, so this installs the pin.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt, rust-src

      - name: Verify toolchain pin
        run: |
          PIN="${{ steps.pin.outputs.channel }}"
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::CI toolchain (${ACTUAL}) does not match rust-toolchain.toml pin (${PIN})"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Regression guard for this issue: a swallow token (`|| true` /
      # `continue-on-error: true`) anywhere in ci.yml or migration-scorecard.yml
      # must carry a `justified-guard:` comment, or CI goes red. The audit also
      # refuses a `pull_request:` trigger restricted to `branches:` (CON-209) and
      # a workflow retired by ADR (ADR 0002).
      - name: Audit test gates
        run: python3 harness/ci/check_test_gates.py

      # The guard that cannot itself fail is the same defect it exists to catch,
      # so the audit ships with tests. These are the first test step in this job,
      # which makes every later test step reachable only behind a condition --
      # the very rule `audit_unreachable_test_steps()` enforces, applied to
      # ourselves rather than described in a comment.
      - name: Run gate audit tests
        run: python3 harness/ci/test_check_test_gates.py

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --workspace \
            --profile ci \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Unit Test Results
          include_passed: true
          # The gate. `fail_on_failure` makes a red test red the job even if the
          # exit code is ever masked again; `require_tests` makes an empty report
          # a failure instead of a silent pass (the scorecard's Rust step was
          # emitting tests="0" failures="0" and rendering as green).
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30

      # CON-303: `cargo nextest` does not run doctests, and doctests are the
      # only tests in this workspace that resolve a crate *by name*. The 417 lib
      # unit tests compile as part of `consortium` and use `crate::` paths, so
      # they cannot observe the lib target's name at all. That is exactly how
      # CON-207 shipped: `lib.name = "consortium"` sat under `[package]`, where
      # cargo ignores it, so the lib target was really `consortium_crate` and
      # every `use consortium::…` doctest failed with E0433 — with nothing in CI
      # executing them, the whole unit job stayed green on a broken public crate
      # name. This step is the gate that would have caught it.
      #
      # Scope: `--workspace`, measured on 24bf186, because it is a strict
      # superset of the per-crate alternative. Five crates carry doctests —
      # `consortium` (8), `consortium-nix` (3), `consortium-cli` (2),
      # `consortium-fanout-sim` (2), `consortium-test-harness` (1) — for 16
      # doctests total, where `-p consortium-crate --doc` would gate only the 8
      # in `consortium`. The defect this guards is a target-name defect, and it
      # is not confined to one crate: renaming any lib target breaks every
      # `use <crate>::` in that crate's doctests, so the gate has to be
      # workspace-wide to be honest about the class of bug. Cost is ~4s warm
      # (~81s cold, mostly deps it already compiles for the nextest run above).
      # `--no-fail-fast` matches the nextest step so one broken crate still
      # reports every other crate's doctests.
      #
      # No swallow token. `harness/ci/check_test_gates.py` fails CI on an
      # unjustified `|| true` / `continue-on-error: true`, so this step cannot be
      # quietly neutered.
      #
      # Named "Run doc tests" rather than "Run doctests" on purpose: the audit's
      # test-step vocabulary is `^run\b.*\btests?\b`, and `\btests?\b` cannot
      # match inside the single word "doctests" (there is no word boundary before
      # the "test"), so a step named "Run doctests" would be invisible to
      # `check_test_gates.py::audit_unreachable_test_steps`. Spelling it as two
      # words puts this step under the repo's own guard.
      #
      # `if: ${{ !cancelled() }}` because GitHub's default step condition is
      # `success()`: without it this step is *skipped* rather than run whenever
      # the nextest step above is red, which would hide a second, independent
      # signal. `audit_unreachable_test_steps` enforces the same rule, and it
      # does catch this step -- verified by deleting the `if:` locally and
      # watching the audit go red. That is the difference between a step that is
      # guarded by the audit and one that merely happens to carry the condition.
      - name: Run doc tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --no-fail-fast

      # CON-97: `continue-on-error` removed. clippy is a lint gate, not a test
      # step, and it is already green — verified on runs 32534376596 (master)
      # and 36076732386 (ci/buildbot-checks), where the step conclusion is
      # `success`. The guard was protecting nothing, so it came off.
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check docs build
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps


  # ── Layer 2: Docker Integration Tests (GitHub-hosted) ─────────────
  docker-integration:
    name: Docker Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pin
        id: pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          echo "channel=$PIN" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt, rust-src

      - name: Verify toolchain pin
        run: |
          PIN="${{ steps.pin.outputs.channel }}"
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::CI toolchain (${ACTUAL}) does not match rust-toolchain.toml pin (${PIN})"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docker-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate SSH keys for test containers
        run: |
          mkdir -p tests/docker/ssh
          ssh-keygen -t ed25519 -f tests/docker/ssh/id_ed25519 -N "" -q
          cp tests/docker/ssh/id_ed25519.pub tests/docker/ssh/authorized_keys

      - name: Build SSH node image
        run: docker build -t consortium-ssh-node -f tests/docker/Dockerfile.ssh-node tests/docker/

      # `-p consortium` never matched a package: the crate at crates/consortium
      # is `consortium-crate` (its *lib* is named `consortium`). The step died on
      # `error: package ID specification 'consortium' did not match any packages`
      # and `|| true` hid it, so this job had never executed a single test.
      - name: Run Docker integration tests
        run: |
          cargo nextest run -p consortium-crate \
            --features docker-tests \
            --test docker_integration \
            --profile ci \
            --test-threads=1 \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Docker Integration Results
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-integration-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30


      - name: Cleanup containers
        if: always()
        run: |
          docker ps -a --filter "name=consortium-test" -q | xargs -r docker rm -f
          docker network ls --filter "name=consortium-test" -q | xargs -r docker network rm

  # ── Layer 2b: Tool Integration Tests (self-hosted, needs Docker + nix) ─
  tool-integration:
    name: Tool Integration Tests
    needs: unit
    runs-on: nix-builder
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pinned Rust toolchain
        run: |
          # CON-97: `rustup default stable 2>/dev/null || true` is deleted. It
          # silently installed/selected `stable`, discarding the pin. This
          # installs the channel `rust-toolchain.toml` actually names.
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          rustup toolchain install "$PIN" --profile minimal --no-self-update
          cargo --version
          cargo nextest --version

      - name: Verify toolchain pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::self-hosted runner is not using the pinned toolchain (${ACTUAL} != ${PIN})."
            echo "::error::the NixOS shell is shadowing the rustup shims; pin nixpkgs rust to ${PIN}"
            echo "::error::or prepend \${CARGO_HOME:-\$HOME/.cargo}/bin to PATH in the runner's extraPackages."
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tool-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate SSH keys for test containers
        run: |
          mkdir -p tests/docker/ssh
          if [ ! -f tests/docker/ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f tests/docker/ssh/id_ed25519 -N "" -q
            cp tests/docker/ssh/id_ed25519.pub tests/docker/ssh/authorized_keys
          fi

      - name: Build specialized Docker images
        run: |
          docker build -t consortium-ssh-node -f tests/docker/Dockerfile.ssh-node tests/docker/
          docker build -t consortium-nix-node -f tests/docker/Dockerfile.nix-node tests/docker/
          docker build -t consortium-ansible-node -f tests/docker/Dockerfile.ansible-node tests/docker/

      # Same `-p consortium` defect as the docker job: zero tests ever ran here.
      - name: Run tool integration tests
        run: |
          cargo nextest run -p consortium-crate \
            --features docker-tests \
            --test tool_integration \
            --profile ci \
            --test-threads=1 \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Tool Integration Results
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-integration-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30


      - name: Generate summary
        if: always()
        run: |
          RUNNER_HOST=$(cat /etc/hostname 2>/dev/null || hostname 2>/dev/null || echo "$RUNNER_NAME")
          echo "## Tool Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`${RUNNER_HOST}\` (self-hosted NixOS)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup containers
        if: always()
        run: |
          docker ps -a --filter "name=nix-int\|ansible-int" -q | xargs -r docker rm -f

  # ── Layer 3: Nix Integration (self-hosted NixOS Mac Minis) ────────
  nix-integration:
    name: Nix Integration (self-hosted)
    needs: [docker-integration, tool-integration]
    runs-on: nix-builder
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Build consortium-cli
        run: nix build .#consortium-cli

      - name: Verify cast binary works
        run: |
          ./result/bin/cast --help
          ./result/bin/claw --help

      # justified-guard: this is a distributed-build *reachability* probe against
      # self-hosted Nix builders, not a test step and not a build of this repo's
      # code -- `nix build .#consortium-cli` above is the real build gate and is
      # unguarded. This step already no-ops when /etc/nix/machines is absent; the
      # guard covers the case where the machines file exists but the builders are
      # offline or mid-reboot, which is an infrastructure outage, not a code
      # regression. Un-swallowing it would make builder flakiness block every PR.
      - name: Test distributed builds (if builders reachable)
        continue-on-error: true
        run: |
          if [ -f /etc/nix/machines ]; then
            nix build .#consortium-cli --builders @/etc/nix/machines --max-jobs 0
          else
            echo "No machines file, skipping distributed build test"
          fi

      - name: Generate summary
        if: always()
        run: |
          echo "## Nix Integration (self-hosted)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -L result ]; then
            echo "| \`nix build .#consortium-cli\` | ✅ \`$(readlink result)\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`nix build .#consortium-cli\` | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /etc/nix/machines ]; then
            echo "| Distributed builders | ✅ $(wc -l < /etc/nix/machines) builders |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Distributed builders | ⚠️ not configured |" >> $GITHUB_STEP_SUMMARY
          fi
          RUNNER_HOST=$(cat /etc/hostname 2>/dev/null || hostname 2>/dev/null || echo "$RUNNER_NAME")
          NIX_VER=$(nix --version 2>/dev/null || echo "unknown")
          echo "| Runner | \`${RUNNER_HOST}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Nix | \`${NIX_VER}\` |" >> $GITHUB_STEP_SUMMARY
