name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'doc/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# `checks: write` is required by mikepenz/action-junit-report. Without it the
# report step cannot create its check run, so the JUnit gate was inert: the
# report was printed to the log and the failure was dropped on the floor.
permissions:
  contents: read
  checks: write

# Nix builds are flake `checks` (cargo-test, cargo-clippy, cargo-fmt,
# consortium, consortium-cli-smoke, pre-commit), built by buildbot-nix on
# PRs; GitHub Actions runs no Nix. The former self-hosted "Nix Integration"
# job is therefore redundant with `consortium-cli-smoke` and `nix build
# .#consortium-cli` there, and is not repeated here.
jobs:
  # ── Layer 1: Unit Tests (fast, GitHub-hosted) ─────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CON-97: CI must run the toolchain `rust-toolchain.toml` pins, and must
      # say so in the log. The pin is read from the file, never duplicated here,
      # so bumping the pin is a one-line commit with no workflow edit.
      - name: Read toolchain pin
        id: pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          echo "channel=$PIN" >> "$GITHUB_OUTPUT"

      # The `@stable` ref is the action's own code selector and is unused when
      # the `toolchain` input is supplied; the input wins, so this installs the pin.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt, rust-src

      - name: Verify toolchain pin
        run: |
          PIN="${{ steps.pin.outputs.channel }}"
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::CI toolchain (${ACTUAL}) does not match rust-toolchain.toml pin (${PIN})"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Regression guard for this issue: a swallow token (`|| true` /
      # `continue-on-error: true`) anywhere in ci.yml or migration-scorecard.yml
      # must carry a `justified-guard:` comment, or CI goes red.
      - name: Audit test gates
        run: python3 harness/ci/check_test_gates.py

      - name: Run unit tests
        run: |
          cargo nextest run --workspace \
            --profile ci \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Unit Test Results
          include_passed: true
          # The gate. `fail_on_failure` makes a red test red the job even if the
          # exit code is ever masked again; `require_tests` makes an empty report
          # a failure instead of a silent pass (the scorecard's Rust step was
          # emitting tests="0" failures="0" and rendering as green).
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30

      # CON-97: `continue-on-error` removed. clippy is a lint gate, not a test
      # step, and it is already green — verified on runs 32534376596 (master)
      # and 36076732386 (ci/buildbot-checks), where the step conclusion is
      # `success`. The guard was protecting nothing, so it came off.
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check docs build
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps


  # ── Layer 2: Docker Integration Tests (GitHub-hosted) ─────────────
  docker-integration:
    name: Docker Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pin
        id: pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          echo "channel=$PIN" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt, rust-src

      - name: Verify toolchain pin
        run: |
          PIN="${{ steps.pin.outputs.channel }}"
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::CI toolchain (${ACTUAL}) does not match rust-toolchain.toml pin (${PIN})"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docker-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate SSH keys for test containers
        run: |
          mkdir -p tests/docker/ssh
          ssh-keygen -t ed25519 -f tests/docker/ssh/id_ed25519 -N "" -q
          cp tests/docker/ssh/id_ed25519.pub tests/docker/ssh/authorized_keys

      - name: Build SSH node image
        run: docker build -t consortium-ssh-node -f tests/docker/Dockerfile.ssh-node tests/docker/

      # `-p consortium` never matched a package: the crate at crates/consortium
      # is `consortium-crate` (its *lib* is named `consortium`). The step died on
      # `error: package ID specification 'consortium' did not match any packages`
      # and `|| true` hid it, so this job had never executed a single test.
      - name: Run Docker integration tests
        run: |
          cargo nextest run -p consortium-crate \
            --features docker-tests \
            --test docker_integration \
            --profile ci \
            --test-threads=1 \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Docker Integration Results
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-integration-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30


      - name: Cleanup containers
        if: always()
        run: |
          docker ps -a --filter "name=consortium-test" -q | xargs -r docker rm -f
          docker network ls --filter "name=consortium-test" -q | xargs -r docker network rm

  # ── Layer 2b: Tool Integration Tests (self-hosted, needs Docker + nix) ─
  tool-integration:
    name: Tool Integration Tests
    needs: unit
    runs-on: nix-builder
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pinned Rust toolchain
        run: |
          # CON-97: `rustup default stable 2>/dev/null || true` is deleted. It
          # silently installed/selected `stable`, discarding the pin. This
          # installs the channel `rust-toolchain.toml` actually names.
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          rustup toolchain install "$PIN" --profile minimal --no-self-update
          cargo --version
          cargo nextest --version

      - name: Verify toolchain pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::self-hosted runner is not using the pinned toolchain (${ACTUAL} != ${PIN})."
            echo "::error::the NixOS shell is shadowing the rustup shims; pin nixpkgs rust to ${PIN}"
            echo "::error::or prepend \${CARGO_HOME:-\$HOME/.cargo}/bin to PATH in the runner's extraPackages."
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tool-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate SSH keys for test containers
        run: |
          mkdir -p tests/docker/ssh
          if [ ! -f tests/docker/ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f tests/docker/ssh/id_ed25519 -N "" -q
            cp tests/docker/ssh/id_ed25519.pub tests/docker/ssh/authorized_keys
          fi

      - name: Build specialized Docker images
        run: |
          docker build -t consortium-ssh-node -f tests/docker/Dockerfile.ssh-node tests/docker/
          docker build -t consortium-nix-node -f tests/docker/Dockerfile.nix-node tests/docker/
          docker build -t consortium-ansible-node -f tests/docker/Dockerfile.ansible-node tests/docker/

      # Same `-p consortium` defect as the docker job: zero tests ever ran here.
      - name: Run tool integration tests
        run: |
          cargo nextest run -p consortium-crate \
            --features docker-tests \
            --test tool_integration \
            --profile ci \
            --test-threads=1 \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Tool Integration Results
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-integration-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30


      - name: Generate summary
        if: always()
        run: |
          RUNNER_HOST=$(cat /etc/hostname 2>/dev/null || hostname 2>/dev/null || echo "$RUNNER_NAME")
          echo "## Tool Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`${RUNNER_HOST}\` (self-hosted NixOS)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup containers
        if: always()
        run: |
          docker ps -a --filter "name=nix-int\|ansible-int" -q | xargs -r docker rm -f
