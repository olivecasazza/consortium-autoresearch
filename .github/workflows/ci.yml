name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'doc/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# `checks: write` is required by mikepenz/action-junit-report. Without it the
# report step cannot create its check run, so the JUnit gate was inert: the
# report was printed to the log and the failure was dropped on the floor.
permissions:
  contents: read
  checks: write

jobs:
  # ── Layer 1: Unit Tests (fast, GitHub-hosted) ─────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CON-97: CI must run the toolchain `rust-toolchain.toml` pins, and must
      # say so in the log. The pin is read from the file, never duplicated here,
      # so bumping the pin is a one-line commit with no workflow edit.
      - name: Read toolchain pin
        id: pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          echo "channel=$PIN" >> "$GITHUB_OUTPUT"

      # The `@stable` ref is the action's own code selector and is unused when
      # the `toolchain` input is supplied; the input wins, so this installs the pin.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt, rust-src

      - name: Verify toolchain pin
        run: |
          PIN="${{ steps.pin.outputs.channel }}"
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::CI toolchain (${ACTUAL}) does not match rust-toolchain.toml pin (${PIN})"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Regression guard for this issue: a swallow token (`|| true` /
      # `continue-on-error: true`) anywhere in ci.yml or migration-scorecard.yml
      # must carry a `justified-guard:` comment, or CI goes red.
      - name: Audit test gates
        run: python3 harness/ci/check_test_gates.py

      - name: Run unit tests
        run: |
          cargo nextest run --workspace \
            --profile ci \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Unit Test Results
          include_passed: true
          # The gate. `fail_on_failure` makes a red test red the job even if the
          # exit code is ever masked again; `require_tests` makes an empty report
          # a failure instead of a silent pass (the scorecard's Rust step was
          # emitting tests="0" failures="0" and rendering as green).
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30

      # CON-97: `continue-on-error` removed. clippy is a lint gate, not a test
      # step, and it is already green — verified on runs 32534376596 (master)
      # and 36076732386 (ci/buildbot-checks), where the step conclusion is
      # `success`. The guard was protecting nothing, so it came off.
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check docs build
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps


  # ── Layer 2: Docker Integration Tests (GitHub-hosted) ─────────────
  docker-integration:
    name: Docker Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pin
        id: pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          echo "channel=$PIN" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt, rust-src

      - name: Verify toolchain pin
        run: |
          PIN="${{ steps.pin.outputs.channel }}"
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::CI toolchain (${ACTUAL}) does not match rust-toolchain.toml pin (${PIN})"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docker-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate SSH keys for test containers
        run: |
          mkdir -p tests/docker/ssh
          ssh-keygen -t ed25519 -f tests/docker/ssh/id_ed25519 -N "" -q
          cp tests/docker/ssh/id_ed25519.pub tests/docker/ssh/authorized_keys

      - name: Build SSH node image
        run: docker build -t consortium-ssh-node -f tests/docker/Dockerfile.ssh-node tests/docker/

      # `-p consortium` never matched a package: the crate at crates/consortium
      # is `consortium-crate` (its *lib* is named `consortium`). The step died on
      # `error: package ID specification 'consortium' did not match any packages`
      # and `|| true` hid it, so this job had never executed a single test.
      - name: Run Docker integration tests
        run: |
          cargo nextest run -p consortium-crate \
            --features docker-tests \
            --test docker_integration \
            --profile ci \
            --test-threads=1 \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Docker Integration Results
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-integration-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30


      - name: Cleanup containers
        if: always()
        run: |
          docker ps -a --filter "name=consortium-test" -q | xargs -r docker rm -f
          docker network ls --filter "name=consortium-test" -q | xargs -r docker network rm

  # ── Layer 2b: Tool Integration Tests (Docker + nix inside containers) ──
  # CON-113: this job used `runs-on: nix-builder`, a self-hosted label with
  # zero runners registered on this repository
  # (`gh api repos/olivecasazza/consortium-autoresearch/actions/runners` ->
  # `{"total_count":0}`). A job targeting a label no runner advertises is not
  # failed, it is *never scheduled*: it sits in `queued` forever and produces no
  # signal at all. That is a worse defect than a swallowed step, and it hid
  # here for the entire life of the workflow — the tool-integration suite has
  # never produced a single CI result. Every requirement this job actually has
  # (Docker, rustup, ssh-keygen) ships on GitHub-hosted `ubuntu-latest`, and the
  # nix/ansible nodes it builds are Linux containers, so the self-hosted NixOS
  # Mac Minis were never load-bearing for it. It now runs where a runner exists.
  tool-integration:
    name: Tool Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # CON-113: the self-hosted NixOS runner supplied cargo-nextest from its
      # `extraPackages`. `ubuntu-latest` does not, and this job has no
      # nextest-install step, so the next line would have died on
      # `no such command: cargo nextest`. Install it explicitly.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Setup pinned Rust toolchain
        run: |
          # CON-97: `rustup default stable 2>/dev/null || true` is deleted. It
          # silently installed/selected `stable`, discarding the pin. This
          # installs the channel `rust-toolchain.toml` actually names.
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read [toolchain] channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml pins channel=$PIN"
          rustup toolchain install "$PIN" --profile minimal --no-self-update
          cargo --version
          cargo nextest --version

      - name: Verify toolchain pin
        run: |
          PIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          ACTUAL=$(rustc --version)
          echo "pinned channel    : $PIN"
          echo "rustc --version   : $ACTUAL"
          echo "active toolchain  : $(rustup show active-toolchain 2>/dev/null || echo 'rustup unavailable')"
          if ! echo "$ACTUAL" | grep -q "^rustc ${PIN}"; then
            echo "::error::runner is not using the pinned toolchain (${ACTUAL} != ${PIN})."
            echo "::error::the pinned channel from rust-toolchain.toml must be the active one."
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tool-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate SSH keys for test containers
        run: |
          mkdir -p tests/docker/ssh
          if [ ! -f tests/docker/ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f tests/docker/ssh/id_ed25519 -N "" -q
            cp tests/docker/ssh/id_ed25519.pub tests/docker/ssh/authorized_keys
          fi

      - name: Build specialized Docker images
        run: |
          docker build -t consortium-ssh-node -f tests/docker/Dockerfile.ssh-node tests/docker/
          docker build -t consortium-nix-node -f tests/docker/Dockerfile.nix-node tests/docker/
          docker build -t consortium-ansible-node -f tests/docker/Dockerfile.ansible-node tests/docker/

      # Same `-p consortium` defect as the docker job: zero tests ever ran here.
      - name: Run tool integration tests
        run: |
          cargo nextest run -p consortium-crate \
            --features docker-tests \
            --test tool_integration \
            --profile ci \
            --test-threads=1 \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Tool Integration Results
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-integration-test-reports
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30


      - name: Generate summary
        if: always()
        run: |
          RUNNER_HOST=$(cat /etc/hostname 2>/dev/null || hostname 2>/dev/null || echo "$RUNNER_NAME")
          echo "## Tool Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`${RUNNER_HOST}\` (GitHub-hosted \`ubuntu-latest\`, Linux/amd64)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup containers
        if: always()
        run: |
          docker ps -a --filter "name=nix-int\|ansible-int" -q | xargs -r docker rm -f

  # ── Layer 3: Nix Integration (flake build, GitHub-hosted) ───────────
  # CON-113: same defect as the two jobs above — `runs-on: nix-builder` with no
  # such runner, so this job has never executed either. The only reason it
  # needed a NixOS host was that Nix was preinstalled there; nix installs
  # cleanly on `ubuntu-latest` in one step, and the flake's `systems` list
  # already includes `x86_64-linux`, which is what that runner is.
  nix-integration:
    name: Nix Integration
    needs: [docker-integration, tool-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `magic-nix-cache-action` configures an already-installed nix; it does not
      # install one. On the NixOS runner nix came from the host, so this is the
      # step that has to exist now. `extra_nix_config` enables the `nix-command`
      # and `flakes` features that `nix build .#consortium-cli` requires.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Build consortium-cli
        run: nix build .#consortium-cli

      - name: Verify cast binary works
        run: |
          ./result/bin/cast --help
          ./result/bin/claw --help

      # CON-113: the `Test distributed builds (if builders reachable)` step is
      # deleted rather than re-pointed. It read `/etc/nix/machines` from the
      # self-hosted host to find the NixOS Mac Minis, and that file only ever
      # existed because the *job itself* ran on one of them. On `ubuntu-latest`
      # the step could only ever print "No machines file, skipping" — a step
      # that can never test anything, the same silent-blindness class as a
      # swallowed step, so keeping it would have re-created the defect this
      # issue is about. Those Mac Minis are retired: there are zero self-hosted
      # runners on this repository and none are being registered by this change.
      # If a Nix builder fleet comes back, re-add the probe as its own job with
      # a real fleet to probe — not as a step that silently no-ops.

      - name: Generate summary
        if: always()
        run: |
          echo "## Nix Integration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -L result ]; then
            echo "| \`nix build .#consortium-cli\` | ✅ \`$(readlink result)\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`nix build .#consortium-cli\` | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Distributed builders | retired — no self-hosted fleet (CON-113) |" >> $GITHUB_STEP_SUMMARY
          RUNNER_HOST=$(cat /etc/hostname 2>/dev/null || hostname 2>/dev/null || echo "$RUNNER_NAME")
          NIX_VER=$(nix --version 2>/dev/null || echo "unknown")
          echo "| Runner | \`${RUNNER_HOST}\` (GitHub-hosted \`ubuntu-latest\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Nix | \`${NIX_VER}\` |" >> $GITHUB_STEP_SUMMARY
